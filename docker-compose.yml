services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: geo_emploi
      POSTGRES_PASSWORD: geo_emploi_dev
      POSTGRES_DB: geo_emploi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: